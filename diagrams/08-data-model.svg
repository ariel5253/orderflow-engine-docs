  <text class="s" x="40" y="600" text-anchor="start" font-size="10.5" fill="#475569">Every tenant-scoped table is keyed by (tenant_id, id) and references tenants (not drawn). quotes and orders reference customers; the order FK pins customer_id to its quote.</text>
  <text class="s" x="40" y="620" text-anchor="start" font-size="10.5" fill="#475569">The order stores no breakdown amount: its lines are the quote lines, so quote and order cannot diverge.</text>
