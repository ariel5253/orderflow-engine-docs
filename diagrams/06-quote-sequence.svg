  <rect class="note" x="40" y="540" width="340" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="54" y="562" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">Pure and deterministic</text>
  <text class="s" x="54" y="581" text-anchor="start" font-size="10.5" fill="#475569">The engine does no I/O, so the same snapshot always</text>
  <text class="s" x="54" y="597" text-anchor="start" font-size="10.5" fill="#475569">gives the same breakdown; the golden tests pin</text>
  <text class="s" x="54" y="613" text-anchor="start" font-size="10.5" fill="#475569">its output.</text>
  <rect class="note" x="410" y="540" width="340" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="424" y="562" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">Insert-only</text>
  <text class="s" x="424" y="581" text-anchor="start" font-size="10.5" fill="#475569">Quote rows are never updated. The order will</text>
  <text class="s" x="424" y="597" text-anchor="start" font-size="10.5" fill="#475569">point at these lines and store no amount, so</text>
  <text class="s" x="424" y="613" text-anchor="start" font-size="10.5" fill="#475569">every figure exists exactly once.</text>
  <rect class="note" x="780" y="540" width="340" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="794" y="562" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">Credit is advisory here</text>
  <text class="s" x="794" y="581" text-anchor="start" font-size="10.5" fill="#475569">The quote reports fits, available and shortfall,</text>
  <text class="s" x="794" y="597" text-anchor="start" font-size="10.5" fill="#475569">but reserves nothing; the limit is enforced</text>
  <text class="s" x="794" y="613" text-anchor="start" font-size="10.5" fill="#475569">when the order is confirmed.</text>
