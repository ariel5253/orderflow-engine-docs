<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Workspace: orderflow-engine-docs specifies the API, the web client and the infrastructure; orderflow-engine-tools generates the figures, the progress chart and the ADR in Word and PDF into orderflow-engine-docs; the web client reads the API contract of orderflow-engine-api; orderflow-engine-infra provides the full stack with Docker Compose and runs the tests; orderflow-engine-app is reserved; orderflow-engine-api is the deliverable." font-family="ui-sans-serif, system-ui, &#x27;Segoe UI&#x27;, Roboto, Helvetica, Arial, sans-serif">
  <title>Workspace: six folders, each a future repository</title>
  <desc>Arrows show what each repository takes from another; the specification governs all of them</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ea" d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker><marker id="abad" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="eabad" d="M0,0 L10,4 L0,8 z" fill="#dc2626"/></marker><marker id="atx" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="eatx" d="M0,0 L10,4 L0,8 z" fill="#16a34a"/></marker><marker id="akey" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="eakey" d="M0,0 L10,4 L0,8 z" fill="#0284c7"/></marker>
    <style>
    @media (prefers-color-scheme: dark) {
      .card { fill: #0b1220; stroke: #1e293b; } .group { fill: #0f172a; stroke: #334155; }
      .node { fill: #111a2e; stroke: #475569; } .key { fill: #0c3a52; stroke: #38bdf8; }
      .tx { fill: #052e1a; stroke: #22c55e; } .warn { fill: #3a2a06; stroke: #f59e0b; }
      .muted { fill: #0f172a; stroke: #475569; } .note { fill: #131c2e; stroke: #475569; }
      .bad { fill: #3b0d0d; stroke: #f87171; }
      .t { fill: #e2e8f0; } .s { fill: #94a3b8; } .txt { fill: #4ade80; } .warnt { fill: #fbbf24; }
      .badt { fill: #f87171; } .keyt { fill: #38bdf8; }
      .edge { stroke: #94a3b8; } .ea { fill: #94a3b8; } .edgebad { stroke: #f87171; } .eabad { fill: #f87171; }
      .edgetx { stroke: #4ade80; } .eatx { fill: #4ade80; } .edgekey { stroke: #38bdf8; } .eakey { fill: #38bdf8; }
      .life { stroke: #475569; } .halo { stroke: #0b1220; }
    }
    </style>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="469" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t" x="480" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Workspace: six folders, each a future repository</text>
  <text class="s" x="480" y="54" text-anchor="middle" font-size="11.5" fill="#475569">Arrows show what each repository takes from another; the specification governs all of them</text>
  <rect class="key" x="370" y="84" width="220" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text class="t" x="480" y="110.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">orderflow-engine-docs</text>
  <text class="s" x="480" y="126.5" text-anchor="middle" font-size="10.5" fill="#475569">spec · contract · results</text>
  <rect class="node" x="690" y="84" width="220" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="t" x="800" y="110.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">orderflow-engine-tools</text>
  <text class="s" x="800" y="126.5" text-anchor="middle" font-size="10.5" fill="#475569">generators · checks</text>
  <rect class="node" x="50" y="224" width="220" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="t" x="160" y="250.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">orderflow-engine-web</text>
  <text class="s" x="160" y="266.5" text-anchor="middle" font-size="10.5" fill="#475569">Angular · full order flow · nginx</text>
  <rect class="key" x="370" y="224" width="220" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text class="t" x="480" y="250.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">orderflow-engine-api</text>
  <text class="s" x="480" y="266.5" text-anchor="middle" font-size="10.5" fill="#475569">the deliverable · code · ADR</text>
  <rect class="node" x="690" y="224" width="220" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="t" x="800" y="250.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">orderflow-engine-infra</text>
  <text class="s" x="800" y="266.5" text-anchor="middle" font-size="10.5" fill="#475569">full-stack compose · test-all</text>
  <rect class="muted" x="50" y="360" width="220" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="t" x="160" y="384.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">orderflow-engine-app</text>
  <text class="s" x="160" y="400.5" text-anchor="middle" font-size="10.5" fill="#475569">reserved · not built</text>
  <path class="edge" d="M690,114 L593,114" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="s halo" x="640" y="106" text-anchor="middle" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">generates</text>
  <path class="edge" d="M480,144 L480,221" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="edge" d="M430,144 L430,184 L160,184 L160,221" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="edge" d="M530,144 L530,184 L800,184 L800,221" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="s halo" x="300" y="176" text-anchor="middle" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">specifies</text>
  <text class="s halo" x="665" y="176" text-anchor="middle" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">specifies</text>
  <text class="s halo" x="488" y="206" text-anchor="start" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">specifies</text>
  <path class="edge" d="M270,254 L367,254" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="s halo" x="320" y="246" text-anchor="middle" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">API contract</text>
  <path class="edge" d="M690,254 L593,254" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="s halo" x="640" y="246" text-anchor="middle" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">runs tests</text>
  <path class="edge" d="M800,284 L800,322 L160,322 L160,287" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="s halo" x="480" y="314" text-anchor="middle" font-size="10.5" fill="#475569" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">runs tests</text>
  <rect class="note" x="330" y="352" width="600" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="344" y="374" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">Why separate repositories</text>
  <text class="s" x="344" y="393" text-anchor="start" font-size="10.5" fill="#475569">orderflow-engine-api stands alone as the deliverable: code, tests, single command, README and ADR.</text>
  <text class="s" x="344" y="409" text-anchor="start" font-size="10.5" fill="#475569">Generators live in tools; their results and the specification live once, in docs.</text>
  <text class="s" x="936" y="454" text-anchor="end" font-size="10" fill="#475569">Source: SPEC §15 · ADR-0001 · generated by orderflow-engine-tools</text>
</svg>
